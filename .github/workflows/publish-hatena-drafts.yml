name: Publish Hatena Drafts

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "devlog/drafts/ 以下のファイル名。空欄なら未投稿候補をすべて送信"
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select drafts
        id: drafts
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.draft }}" ]]; then
            file="devlog/drafts/${{ inputs.draft }}"
            test -f "$file"
            echo "files=$file" >> "$GITHUB_OUTPUT"
          else
            files=$(find devlog/drafts -maxdepth 1 -type f -name '*.md' | sort | tr '\n' ' ')
            test -n "$files"
            echo "files=$files" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish as Hatena drafts
        env:
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
        run: python3 scripts/publish_hatena.py ${{ steps.drafts.outputs.files }}
