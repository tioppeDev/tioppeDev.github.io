<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="tioppeDevの個人サイト。ゲーム開発、Web開発、AI活用について紹介します。">
  <title>tioppeDev</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      line-height: 1.6;
      color: #1f2937;
      background: #f3f4f6;
    }

    body {
      min-height: 100vh;
    }

    a {
      color: inherit;
    }

    header {
      padding: 72px 24px;
      color: #ffffff;
      text-align: center;
      background: #111827;
    }

    header h1 {
      margin-bottom: 12px;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      letter-spacing: 0.04em;
    }

    header p {
      color: #d1d5db;
      font-size: 1.05rem;
    }

    main {
      width: min(960px, calc(100% - 32px));
      margin: 40px auto;
    }

    section {
      margin-bottom: 24px;
      padding: 28px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(17, 24, 39, 0.06);
    }

    h2 {
      margin-bottom: 14px;
      font-size: 1.5rem;
    }

    p + p {
      margin-top: 12px;
    }

    .project-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .project-card {
      padding: 20px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #f9fafb;
    }

    .project-card h3 {
      margin-bottom: 8px;
    }

    .link-button {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 16px;
      color: #ffffff;
      text-decoration: none;
      background: #2563eb;
      border-radius: 8px;
    }

    .link-button:hover,
    .link-button:focus-visible {
      background: #1d4ed8;
    }

    footer {
      padding: 28px 16px 40px;
      color: #6b7280;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>tioppeDev</h1>
    <p>ゲーム開発・Web開発・AI活用</p>
  </header>

  <main>
    <section aria-labelledby="about-title">
      <h2 id="about-title">About</h2>
      <p>
        個人でゲームやWebアプリを開発しています。
        AIを活用した開発ワークフローや、シミュレーションゲーム制作にも取り組んでいます。
      </p>
    </section>

    <section aria-labelledby="projects-title">
      <h2 id="projects-title">Projects</h2>

      <div class="project-list">
        <article class="project-card">
          <h3>ニポラ島日記</h3>
          <p>生活、経験、知識、発明がつながっていく島の生活シミュレーションゲームです。</p>
        </article>

        <article class="project-card">
          <h3>New Project</h3>
          <p>今後の制作物をここに追加していきます。</p>
        </article>
      </div>
    </section>

    <section aria-labelledby="github-title">
      <h2 id="github-title">GitHub</h2>
      <p>開発中のプロジェクトや公開リポジトリはGitHubで確認できます。</p>
      <a
        class="link-button"
        href="https://github.com/tioppeDev"
        target="_blank"
        rel="noopener noreferrer"
      >
        GitHubを見る
      </a>
    </section>
  </main>

  <footer>
    <small>&copy; 2026 tioppeDev</small>
  </footer>
</body>
</html>
